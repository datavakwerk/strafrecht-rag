[project]
name = "strafrecht-rag"
version = "0.1.0"
description = "RAG over Dutch criminal-law rulings (Rechtspraak.nl Open Data): every claim carries an ECLI, no source means no answer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "fastembed>=0.4",
    # onnxruntime dropped Intel-Mac wheels after 1.19; keep the chain runnable there
    "onnxruntime<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[project.scripts]
strafrecht-rag = "strafrecht_rag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strafrecht_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["strafrecht_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
