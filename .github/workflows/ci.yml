name: ci

# No network, no embedding model, no LLM in CI (PRD N1):
# recorded XML fixtures, FakeEmbedder and FakeLLM only.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: make install
      - run: make lint
      - run: make test
